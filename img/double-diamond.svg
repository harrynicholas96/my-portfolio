<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for Discover diamond (coral/red) -->
    <linearGradient id="discoverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7B7B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient for Define diamond (orange) -->
    <linearGradient id="defineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA64D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C1A;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient for Develop diamond (blue) -->
    <linearGradient id="developGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5BA3FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A8FE2;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient for Deliver diamond (purple) -->
    <linearGradient id="deliverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B7EDE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6FCC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <style>
    .phase-title { font-family: 'Cairo', sans-serif; font-size: 42px; font-weight: 900; fill: #FFFFFF; text-anchor: start; }
    .item-text { font-family: 'Cairo', sans-serif; font-size: 18px; font-weight: 400; fill: #FFFFFF; text-anchor: start; }
    .section-label { font-family: 'Cairo', sans-serif; font-size: 32px; font-weight: 700; text-anchor: middle; }
    .section-sublabel { font-family: 'Cairo', sans-serif; font-size: 20px; font-weight: 400; fill: #525252; text-anchor: middle; }
    .strategic-label { fill: #FF8C1A; }
    .creative-label { fill: #4A8FE2; }
  </style>

  <!-- Discover Diamond (top-left, coral) -->
  <path d="M 100 400 L 400 100 L 700 400 L 400 700 Z" fill="url(#discoverGradient)" stroke="#0A0A0A" stroke-width="6"/>

  <!-- Define Diamond (bottom-left, orange) -->
  <path d="M 400 700 L 700 400 L 1000 700 L 700 1000 Z" fill="url(#defineGradient)" stroke="#0A0A0A" stroke-width="6"/>

  <!-- Develop Diamond (top-right, blue) -->
  <path d="M 700 400 L 1000 100 L 1300 400 L 1000 700 Z" fill="url(#developGradient)" stroke="#0A0A0A" stroke-width="6"/>

  <!-- Deliver Diamond (bottom-right, purple) -->
  <path d="M 1000 700 L 1300 400 L 1600 700 L 1300 1000 Z" fill="url(#deliverGradient)" stroke="#0A0A0A" stroke-width="6"/>

  <!-- Discover Content (top-left area) -->
  <text class="phase-title" x="220" y="280">Discover</text>
  <text class="item-text" x="220" y="330">🔍 User Testing</text>
  <text class="item-text" x="220" y="365">📊 Analytics</text>
  <text class="item-text" x="220" y="400">👥 Interviews</text>
  <text class="item-text" x="220" y="435">⚡ Competitor Analysis</text>

  <!-- Define Content (bottom center) -->
  <text class="phase-title" x="620" y="680">Define</text>
  <text class="item-text" x="620" y="730">💡 Problem Statement</text>
  <text class="item-text" x="620" y="765">👤 User Personas</text>
  <text class="item-text" x="620" y="800">📝 Requirements</text>
  <text class="item-text" x="620" y="835">🗺️ Journey Maps</text>

  <!-- Develop Content (top-right area) -->
  <text class="phase-title" x="820" y="280">Develop</text>
  <text class="item-text" x="820" y="330">💡 Ideation</text>
  <text class="item-text" x="820" y="365">🎨 Prototyping</text>
  <text class="item-text" x="820" y="400">🔬 A/B Testing</text>
  <text class="item-text" x="820" y="435">🔄 Iteration</text>

  <!-- Deliver Content (bottom-right area) -->
  <text class="phase-title" x="1120" y="680">Deliver</text>
  <text class="item-text" x="1120" y="730">🚀 Launch</text>
  <text class="item-text" x="1120" y="765">📊 Measure Results</text>
  <text class="item-text" x="1120" y="800">🎯 159% Increase</text>
  <text class="item-text" x="1120" y="835">✅ Success</text>

  <!-- Bottom Labels -->
  <text class="section-label strategic-label" x="550" y="880">Strategic Phase</text>
  <text class="section-sublabel" x="550" y="915">Understanding the problem</text>

  <text class="section-label creative-label" x="1150" y="880">Creative Phase</text>
  <text class="section-sublabel" x="1150" y="915">Building the solution</text>
</svg>